<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI素材库（每天更新）· 尹晨俱乐部出品</title>
<meta name="description" content="蝉妈妈 AI 素材库高赞素材，按 26 个类目分类整理，可在线播放。尹晨俱乐部出品，每天更新。">
<style>
  :root{
    --bg:#0a0b0d; --panel:#12141a; --panel2:#171a21; --line:rgba(255,255,255,.075);
    --text:#e9ebef; --dim:#8b9099; --dim2:#5f646d;
    --red:#fe2c55; --cyan:#25f4ee;
    --radius:14px;
    --topbar-h:132px; --nav-h:92px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-padding-top:calc(var(--topbar-h) + var(--nav-h) + 10px)}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(900px 500px at 15% -10%, rgba(254,44,85,.10), transparent 60%),
                     radial-gradient(800px 500px at 85% -20%, rgba(37,244,238,.07), transparent 60%);
    background-attachment:fixed;
  }
  ::selection{background:rgba(254,44,85,.35)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#2a2e36;border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#3a404a}

  /* ---------- 顶栏 ---------- */
  .topbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between; gap:26px;
    padding:20px 26px;
    background:rgba(10,11,13,.86);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:11px;flex:none}
  .logo{
    width:34px;height:34px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--red),#ff6b81 60%,var(--cyan));
    display:grid;place-items:center;
    box-shadow:0 4px 16px rgba(254,44,85,.32);
  }
  .logo svg{width:18px;height:18px;fill:#fff}
  .brand h1{font-size:16px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
  .brand .sub{font-size:11.5px;color:#9aa0a9;margin-top:2px;white-space:nowrap;letter-spacing:.2px}

  /* 二维码 */
  .qrBox{
    display:flex;align-items:center;gap:13px;flex:none;
    position:absolute; left:50%; transform:translateX(-50%);
  }
  .qrImg{
    width:96px;height:96px;border-radius:10px;display:block;
    background:#fff;padding:4px;box-shadow:0 4px 18px rgba(0,0,0,.45);
  }
  .qrText{display:flex;flex-direction:column;gap:3px;line-height:1.35}
  .qrText b{font-size:19px;font-weight:700;color:#fff;letter-spacing:.5px}
  .qrText span{font-size:14.5px;color:#c3c8d0}

  /* 俱乐部简介 */
  .clubBox{display:flex;align-items:center;gap:12px;flex:none}
  .clubLogo{width:116px;height:auto;display:block;opacity:.94}
  .clubText{display:flex;flex-direction:column;gap:2px;line-height:1.45}
  .clubText b{font-size:15px;font-weight:650;color:#e9ebef;letter-spacing:.3px}
  .clubText span{font-size:12px;color:#949aa4}

  .stats{display:flex;gap:20px;margin-left:8px;flex:none}
  .stat b{display:block;font-size:15px;font-weight:650;font-variant-numeric:tabular-nums}
  .stat span{font-size:10.5px;color:var(--dim2);letter-spacing:.4px}

  .spacer{flex:1}
  .search{position:relative;flex:none;width:230px}
  .search input{
    width:100%;height:34px;padding:0 12px 0 32px;
    background:var(--panel2);border:1px solid var(--line);border-radius:9px;
    color:var(--text);font-size:12.5px;outline:none;transition:.16s;
  }
  .search input::placeholder{color:var(--dim2)}
  .search input:focus{border-color:rgba(254,44,85,.5);background:#1b1f27}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--dim2);fill:none;stroke-width:2}
  select.sort{
    height:34px;padding:0 28px 0 11px;border-radius:9px;
    background:var(--panel2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b9099' stroke-width='2.4'><path d='M6 9l6 6 6-6'/></svg>") no-repeat right 8px center/13px;
    border:1px solid var(--line);color:var(--text);font-size:12.5px;
    appearance:none;outline:none;cursor:pointer;transition:.16s;
  }
  select.sort:hover{border-color:rgba(255,255,255,.18)}

  /* ---------- 类目导航 ---------- */
  .catnav{
    position:sticky; top:var(--topbar-h); z-index:40;
    display:flex; align-items:flex-end; gap:16px; padding:10px 26px 11px;
    background:rgba(10,11,13,.92);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line);
  }
  .chips{flex:1; display:flex; flex-wrap:wrap; gap:5px; min-width:0}
  .navTools{flex:none; display:flex; align-items:center; gap:8px}
  .navTools .search{width:206px}
  .navTools .search input{height:32px;font-size:12px}
  .navTools select.sort{height:32px;font-size:12px}
  .navItem{
    flex:none; display:flex;align-items:center;gap:5px;
    height:27px;padding:0 9px;border-radius:999px;
    background:var(--panel2);border:1px solid var(--line);
    color:var(--dim);font-size:11.5px;cursor:pointer;
    transition:.16s;white-space:nowrap;user-select:none;text-decoration:none;
  }
  .navItem:hover{color:var(--text);border-color:rgba(255,255,255,.18)}
  .navItem i{
    font-style:normal;font-size:10.5px;color:var(--dim2);
    background:rgba(255,255,255,.06);padding:1px 5px;border-radius:5px;
    font-variant-numeric:tabular-nums;
  }
  .navItem.on{
    background:linear-gradient(135deg,rgba(254,44,85,.9),rgba(255,90,120,.85));
    border-color:transparent;color:#fff;font-weight:600;
    box-shadow:0 3px 14px rgba(254,44,85,.28);
  }
  .navItem.on i{background:rgba(0,0,0,.22);color:rgba(255,255,255,.9)}

  /* ---------- 类目区块 ---------- */
  main{padding:8px 26px 80px}
  .catBlock{
    padding-top:26px;
    scroll-margin-top:calc(var(--topbar-h) + var(--nav-h) + 10px);
  }
  .catBlock + .catBlock{border-top:1px solid rgba(255,255,255,.05)}
  .catHead{
    display:flex;align-items:baseline;gap:12px;
    padding:6px 0 15px;cursor:pointer;user-select:none;
  }
  .catHead h2{font-size:19px;font-weight:650;letter-spacing:.4px}
  .catHead .moreLink{
    font-size:12.5px;color:#ff5c78;text-decoration:none;white-space:nowrap;
    padding:3px 10px;border-radius:7px;border:1px solid rgba(254,44,85,.3);
    background:rgba(254,44,85,.09);transition:.16s;cursor:pointer;
  }
  .catHead .moreLink:hover{background:rgba(254,44,85,.22);border-color:rgba(254,44,85,.6);color:#fff}
  .catHead .num{
    font-size:12px;color:#a9aeb7;background:rgba(255,255,255,.06);
    padding:2px 8px;border-radius:6px;font-variant-numeric:tabular-nums;
  }
  .catHead .meta{font-size:12px;color:var(--dim2);font-variant-numeric:tabular-nums}
  .catHead .grow{flex:1}
  .foldIcon{
    width:26px;height:26px;border-radius:7px;border:1px solid var(--line);
    background:var(--panel2);display:grid;place-items:center;transition:.2s;
  }
  .foldIcon svg{width:13px;height:13px;stroke:var(--dim);fill:none;stroke-width:2.4;transition:.2s}
  .catBlock.collapsed .foldIcon svg{transform:rotate(-90deg)}
  .catBlock.collapsed .grid{display:none}

  .grid{
    display:grid;gap:16px;
    grid-template-columns:repeat(auto-fill,minmax(208px,1fr));
  }

  /* ---------- 卡片 ---------- */
  .card{
    position:relative;border-radius:var(--radius);overflow:hidden;
    background:var(--panel);border:1px solid var(--line);
    cursor:pointer;transition:transform .2s cubic-bezier(.2,.7,.3,1), border-color .2s, box-shadow .2s;
  }
  .card:hover{
    transform:translateY(-3px);
    border-color:rgba(254,44,85,.4);
    box-shadow:0 14px 34px rgba(0,0,0,.55), 0 0 0 1px rgba(254,44,85,.12);
  }
  .thumb{position:relative;aspect-ratio:9/16;overflow:hidden;background:#0d0f13}
  .thumb img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s;
  }
  .card:hover .thumb img{transform:scale(1.04)}
  .thumb .ph{
    position:absolute;inset:0;display:grid;place-items:center;padding:18px;
    background:linear-gradient(150deg,#1d2129,#101319 70%);
    color:var(--dim);font-size:12px;text-align:center;line-height:1.65;
  }
  .playbtn{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(1);
    width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(8,10,14,.42);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    display:grid;place-items:center;
    box-shadow:0 2px 10px rgba(0,0,0,.3);
    opacity:.86;transition:.22s cubic-bezier(.2,.7,.3,1);
  }
  .card:hover .playbtn{
    opacity:1;transform:translate(-50%,-50%) scale(1.28);
    background:rgba(254,44,85,.96);
    box-shadow:0 6px 24px rgba(254,44,85,.5);
  }
  .playbtn svg{width:15px;height:15px;fill:#fff;margin-left:2px}

  .dur{
    position:absolute;right:7px;bottom:7px;z-index:3;
    padding:2px 6px;border-radius:5px;background:rgba(0,0,0,.68);
    font-size:10.5px;color:#fff;font-variant-numeric:tabular-nums;
    backdrop-filter:blur(4px);
  }
  .catTag{
    position:absolute;left:7px;top:7px;z-index:3;
    padding:2.5px 7px;border-radius:5px;
    background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.14);
    font-size:10.5px;color:#dfe2e6;backdrop-filter:blur(4px);
  }
  .newTag{
    position:absolute;right:7px;top:7px;z-index:3;
    padding:2.5px 7px;border-radius:5px;
    background:linear-gradient(135deg,#fe2c55,#ff6b81);
    font-size:10px;font-weight:700;color:#fff;letter-spacing:.5px;
    box-shadow:0 2px 8px rgba(254,44,85,.45);
  }
  .aiTag{
    position:absolute;right:7px;top:7px;z-index:3;
    padding:2.5px 7px;border-radius:5px;
    background:linear-gradient(135deg,rgba(37,244,238,.92),rgba(80,200,255,.9));
    font-size:10px;font-weight:700;color:#04222a;letter-spacing:.4px;
  }

  .meta{padding:10px 11px 12px}
  .title{
    font-size:12.5px;line-height:1.5;font-weight:500;color:#dfe2e6;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    height:37px;
  }
  .nums{
    display:flex;align-items:center;gap:12px;margin-top:9px;
    font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;
  }
  .nums .n{display:flex;align-items:center;gap:3.5px}
  .nums svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
  .nums .like{color:#ff5c78}
  .author{margin-top:7px;font-size:11px;color:var(--dim2);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .author b{font-weight:500;color:var(--dim)}

  /* 空态 */
  .empty{display:none;text-align:center;padding:100px 20px;color:var(--dim2);font-size:13.5px;line-height:2}
  .empty b{display:block;color:var(--dim);font-size:15px;margin-bottom:6px}

  /* ---------- 弹层 ---------- */
  .modal{
    position:fixed;inset:0;z-index:100;display:none;
    background:rgba(4,5,7,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .modal.open{display:flex;align-items:center;justify-content:center;gap:34px;padding:34px}
  .stageWrap{position:relative;height:min(84vh,820px);aspect-ratio:9/16;flex:none}
  .stage{
    position:relative;width:100%;height:100%;
    background:#000;border-radius:16px;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.7);
  }
  .stage video{width:100%;height:100%;object-fit:contain;background:#000}
  .stage .ph{
    position:absolute;inset:0;display:grid;place-items:center;text-align:center;
    color:var(--dim);font-size:13px;line-height:2;padding:30px;
    background:linear-gradient(150deg,#1a1e26,#0c0f14);
  }
  .nav{
    position:absolute;top:50%;transform:translateY(-50%);
    width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.16);
    background:rgba(0,0,0,.5);display:grid;place-items:center;cursor:pointer;
    transition:.16s;z-index:5;
  }
  .nav:hover{background:rgba(254,44,85,.9);border-color:transparent}
  .nav svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.4}
  .nav.prev{left:-58px}
  .nav.next{right:-58px}

  .info{width:340px;flex:none;max-height:84vh;overflow-y:auto;padding-right:4px;position:relative}
  .closeBtn{
    position:absolute;right:0;top:-46px;width:34px;height:34px;border-radius:50%;
    border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);
    display:grid;place-items:center;cursor:pointer;transition:.16s;z-index:6;
  }
  .closeBtn:hover{background:rgba(254,44,85,.85);border-color:transparent}
  .closeBtn svg{width:15px;height:15px;stroke:#fff;stroke-width:2.2;fill:none}

  .info h2{font-size:16.5px;line-height:1.55;font-weight:600;margin-bottom:14px}
  .info .row{display:flex;align-items:flex-start;gap:8px;margin-bottom:9px;font-size:12.5px;color:var(--dim)}
  .info .row .k{color:var(--dim2);flex:none;width:52px}
  .info .row .v{color:#dfe2e6;line-height:1.5}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 8px}
  .kpi{
    background:var(--panel2);border:1px solid var(--line);border-radius:11px;
    padding:11px 10px;text-align:center;
  }
  .kpi b{display:block;font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}
  .kpi span{font-size:10.5px;color:var(--dim2);display:block;margin-top:3px}
  .kpi:nth-child(1) b{color:#ff5c78}
  .kpi:nth-child(2) b{color:#5ad8e8}
  .kpi:nth-child(3) b{color:#c9cdd4}

  .acts{display:flex;gap:8px;margin-top:14px}
  .acts a,.acts button{
    flex:1;height:36px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel2);color:#dfe2e6;font-size:12.5px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
    text-decoration:none;transition:.16s;font-family:inherit;
  }
  .acts a:hover,.acts button:hover{border-color:rgba(254,44,85,.55);color:#fff;background:rgba(254,44,85,.14)}
  .info .foot{margin-top:16px;font-size:10.5px;color:var(--dim2);line-height:1.8}

  /* ---------- 新版本提示条 ---------- */
  #verBar{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:200;
    display:flex;align-items:center;gap:12px;
    padding:11px 13px 11px 18px;border-radius:12px;
    background:linear-gradient(135deg,rgba(254,44,85,.97),rgba(255,90,120,.95));
    box-shadow:0 10px 34px rgba(254,44,85,.42);
    font-size:13px;color:#fff;white-space:nowrap;
  }
  #verBar button{
    padding:5px 12px;border-radius:7px;border:none;cursor:pointer;
    background:#fff;color:#c9183b;font-size:12.5px;font-weight:650;font-family:inherit;
  }
  #verBar i{font-style:normal;cursor:pointer;opacity:.72;font-size:16px;line-height:1;padding:0 2px}
  #verBar i:hover{opacity:1}

  @media (max-width:1240px){
    .clubText span:last-child{display:none}
    .navTools .search{width:170px}
  }
  @media (max-width:1160px){
    .qrBox{position:static; transform:none; left:auto}
    .topbar{flex-wrap:wrap;gap:14px}
    .qrBox{order:3}
    .clubBox{order:4;margin-left:auto}
  }
  @media (max-width:1000px){
    .topbar{flex-wrap:wrap;gap:14px;padding:16px 20px}
    .qrBox{order:3}
    .clubBox{order:4;margin-left:auto}
    .modal.open{flex-direction:column;gap:16px;padding:16px;overflow-y:auto}
    .stageWrap{height:auto;width:min(92vw,420px)}
    .info{width:min(92vw,420px);max-height:none}
    .nav.prev{left:6px}.nav.next{right:6px}
    .closeBtn{right:0;top:-44px}
  }
  @media (max-width:640px){
    /* 手机上顶栏压成两行：品牌独占一行，二维码 + 俱乐部并排 */
    .topbar{padding:10px 14px;gap:9px;flex-wrap:wrap}
    .brand{width:100%}
    .brand h1{font-size:14.5px}
    .qrBox{position:static;transform:none;left:auto;flex:1;gap:9px;order:2;min-width:0}
    .qrImg{width:56px;height:56px;padding:3px;border-radius:8px}
    .qrText{gap:1px}
    .qrText b{font-size:13px}
    .qrText span{font-size:10.5px;line-height:1.3}
    .clubBox{order:3;flex:none;gap:7px;margin-left:0}
    .clubLogo{width:64px}
    .clubText{gap:1px}
    .clubText b{font-size:11.5px}
    .clubText span{font-size:9.5px;line-height:1.3}
    .clubText span:last-child{display:none}
    .catnav{top:auto;position:static;flex-wrap:wrap;padding:10px 16px}
    .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .chips::-webkit-scrollbar{display:none}
    .navTools{width:100%}
    .navTools .search{flex:1;width:auto}
    main{padding:4px 16px 60px}
    .grid{grid-template-columns:repeat(2,1fr);gap:11px}
    .title{font-size:12px}
    .catHead h2{font-size:17px}
    html{scroll-padding-top:20px}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    <div>
      <h1 id="pageTitle">AI素材库（每天更新）</h1>
      <div class="sub">尹晨俱乐部出品</div>
    </div>
  </div>

  <div class="qrBox">
    <img class="qrImg" src="assets/qr.png" alt="微信二维码" width="88" height="88">
    <div class="qrText">
      <b>扫码领取</b>
      <span>另一份 AI+电商干货集锦</span>
    </div>
  </div>

  <div class="clubBox">
    <img class="clubLogo" src="assets/logo-yinchen-white.png" alt="尹晨俱乐部">
    <div class="clubText">
      <b>尹晨俱乐部</b>
      <span>国内电商社群 Top 1 · 付费会员 10000+</span>
      <span>做电商，学 AI，加入尹晨俱乐部</span>
    </div>
  </div>
</header>

<nav class="catnav">
  <div class="chips" id="catnav"></div>
  <div class="navTools">
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜索标题 / 达人 / 类目">
    </div>
    <select class="sort" id="sort" title="类目内排序">
      <option value="likes">类目内 · 点赞最多</option>
      <option value="comments">类目内 · 评论最多</option>
      <option value="collects">类目内 · 收藏最多</option>
      <option value="plays">类目内 · 播放最多</option>
      <option value="score">类目内 · 跑量分最高</option>
    </select>
  </div>
</nav>

<main id="main"></main>
<div class="empty" id="empty"><b>没有匹配的素材</b>换个关键词试试</div>

<div class="modal" id="modal">
  <div class="stageWrap">
    <div class="stage" id="stage"></div>
    <button class="nav prev" id="prev" aria-label="上一条"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="nav next" id="next" aria-label="下一条"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <aside class="info" id="info"></aside>
</div>

<script src="data.js"></script>

<script>
(function(){
  const DATA  = window.MATERIALS || {items:[],categories:[]};
  const ITEMS = DATA.items || [];
  const state = {q:'', sort:'likes'};
  let flat = [];            // 当前可见卡片（用于弹层上下切换）
  let curIdx = -1;

  const $ = s => document.querySelector(s);
  const main = $('#main'), catnav = $('#catnav');

  /* ---------- 工具 ---------- */
  function fmt(n){
    n = Number(n)||0;
    if(n >= 100000000) return (n/100000000).toFixed(1).replace(/\.0$/,'') + '亿';
    if(n >= 10000)     return (n/10000).toFixed(1).replace(/\.0$/,'') + 'w';
    if(n >= 1000)      return n.toLocaleString('en-US');
    return String(n);
  }
  function dur(s){
    s = Math.round(Number(s)||0);
    const m = Math.floor(s/60), r = s%60;
    return String(m).padStart(2,'0') + ':' + String(r).padStart(2,'0');
  }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  // 蝉妈妈素材库支持 ?keyword= 搜索：用标题能精确定位到这一条（实测返回 1 条）
  function cmSearchUrl(it){
    const base = 'https://cy.chanmama.com/case/aiMaterialSearch/';
    const kw = (it.title || '').trim().slice(0, 40);
    if(kw)     return base + '?keyword=' + encodeURIComponent(kw);
    if(it.author) return base + '?keyword=' + encodeURIComponent(it.author);
    return base;
  }

  const ICON = {
    like:'<svg viewBox="0 0 24 24"><path d="M20.8 8.6a5 5 0 0 0-8.8-3 5 5 0 0 0-8.8 3c0 5 8.8 10.4 8.8 10.4s8.8-5.4 8.8-10.4z"/></svg>',
    cmt:'<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>',
    star:'<svg viewBox="0 0 24 24"><path d="M12 3.2l2.6 5.3 5.8.9-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.9L12 3.2z"/></svg>',
    play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
    chev:'<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>'
  };

  /* ---------- 分组 ---------- */
  function groupByCat(){
    const order = (DATA.categories && DATA.categories.length)
      ? DATA.categories.slice()
      : [...new Set(ITEMS.map(i=>i.category))];
    const map = {};
    ITEMS.forEach(i => { (map[i.category] = map[i.category] || []).push(i); });
    return order.filter(c => map[c]).map(c => ({cat:c, items:map[c]}));
  }
  const GROUPS = groupByCat();

  /* ---------- 卡片 ---------- */
  function cardHTML(it, gi, idx){
    const cover = it.cover
      ? `<img src="${esc(it.cover)}" alt="" loading="lazy" decoding="async"
             onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">`
      : '';
    const ph = `<div class="ph" style="${it.cover?'display:none':''}">${esc(it.title||'')}</div>`;
    return `
      <article class="card" data-g="${gi}" data-i="${idx}">
        <div class="thumb">
          ${cover}${ph}
          ${it.is_new ? '<span class="newTag">NEW</span>' : '<span class="aiTag">AI</span>'}
          <button class="playbtn" aria-label="播放">${ICON.play}</button>
          ${it.duration ? `<span class="dur">${dur(it.duration)}</span>` : ''}
        </div>
        <div class="meta">
          <h3 class="title">${esc(it.title||'未命名素材')}</h3>
          <div class="nums">
            <span class="n like">${ICON.like}${fmt(it.likes)}</span>
            <span class="n">${ICON.cmt}${fmt(it.comments)}</span>
            <span class="n">${ICON.star}${fmt(it.collects)}</span>
          </div>
          <div class="author">${it.author ? `<b>${esc(it.author)}</b>` : '<b>—</b>'}${it.launch_date? ' · '+esc(it.launch_date):''}</div>
        </div>
      </article>`;
  }

  /* ---------- 渲染主体 ---------- */
  function sortItems(list, key){
    return list.slice().sort((a,b)=> (Number(b[key])||0) - (Number(a[key])||0));
  }

  function render(){
    const q = state.q.trim().toLowerCase();
    const html = [];
    flat = [];

    GROUPS.forEach((g, gi) => {
      let items = g.items.filter(it => {
        if(!q) return true;
        const hay = [it.title, it.author, it.category, it.cat].join(' ').toLowerCase();
        return hay.includes(q);
      });
      if(!items.length) return;
      items = sortItems(items, state.sort);

      const startIdx = flat.length;
      items.forEach(it => flat.push(it));

      html.push(`
        <section class="catBlock" id="sec-${gi}" data-cat="${esc(g.cat)}">
          <div class="catHead" data-fold="${gi}">
            <h2>${esc(g.cat)}</h2>
            <a class="moreLink" href="https://cy.chanmama.com/" target="_blank" rel="noopener">查看更多 ›</a>
            <span class="grow"></span>
            <span class="foldIcon">${ICON.chev}</span>
          </div>
          <div class="grid">${items.map((it,i)=> cardHTML(it, gi, startIdx + i)).join('')}</div>
        </section>`);
    });

    main.innerHTML = html.join('');
    $('#empty').style.display = flat.length ? 'none' : 'block';
    renderNav();
  }

  /* ---------- 类目导航 ---------- */
  function renderNav(){
    const visible = [...main.querySelectorAll('.catBlock')].map(el => ({
      el, cat: el.dataset.cat,
      n: el.querySelectorAll('.card').length
    }));
    catnav.innerHTML = `<a class="navItem" href="#top" data-all="1">全部</a>` +
      visible.map(v => `<a class="navItem" href="#${v.el.id}" data-cat="${esc(v.cat)}">${esc(v.cat)}</a>`).join('');

    catnav.querySelectorAll('.navItem').forEach(a => {
      a.onclick = e => {
        e.preventDefault();
        const id = a.getAttribute('href').slice(1);
        if(id === 'top'){ window.scrollTo({top:0, behavior:'smooth'}); return; }
        const target = document.getElementById(id);
        if(target){ target.classList.remove('collapsed'); target.scrollIntoView({behavior:'smooth', block:'start'}); }
        catnav.querySelectorAll('.navItem').forEach(x=>x.classList.remove('on'));
        a.classList.add('on');
      };
    });
    syncSticky();
  }

  /* 让 sticky 偏移跟着顶栏/导航实际高度走（顶栏放二维码后高度不固定） */
  function syncSticky(){
    const tb = document.querySelector('.topbar');
    const nv = document.querySelector('.catnav');
    const d = document.documentElement.style;
    d.setProperty('--topbar-h', tb.offsetHeight + 'px');
    d.setProperty('--nav-h', nv.offsetHeight + 'px');
  }

  /* ---------- 折叠 ---------- */
  main.addEventListener('click', e => {
    if(e.target.closest('.moreLink')) return;   // 查看更多是外链，不触发折叠
    const head = e.target.closest('.catHead');
    if(head){
      const sec = head.closest('.catBlock');
      sec.classList.toggle('collapsed');
    }
  });

  /* ---------- 打开卡片 ---------- */
  main.addEventListener('click', e => {
    const card = e.target.closest('.card');
    if(card) openByCard(card);
  });

  function openByCard(card){
    const gi = Number(card.dataset.g);
    const secCards = [...card.closest('.grid').querySelectorAll('.card')];
    const pos = secCards.indexOf(card);
    // 全局 flat 里定位这段的起点
    const startIdx = Number(secCards[0].dataset.i);
    openModal(startIdx + pos);
  }

  /* ---------- 弹层 ---------- */
  const modal = $('#modal'), stage = $('#stage'), info = $('#info');

  function openModal(idx){
    const it = flat[idx];
    if(!it) return;
    curIdx = idx;

    stage.querySelectorAll('video,iframe,.ph').forEach(n=>n.remove());
    if(it.embed){
      const f = document.createElement('iframe');
      f.src = it.embed;
      f.allow = 'autoplay; fullscreen; encrypted-media';
      f.setAttribute('allowfullscreen','');
      f.setAttribute('frameborder','0');
      f.setAttribute('referrerpolicy','no-referrer');
      f.style.cssText = 'width:100%;height:100%;border:0;display:block;background:#000';
      stage.appendChild(f);
    }else if(it.video){
      const v = document.createElement('video');
      v.src = it.video; v.controls = true; v.autoplay = true; v.loop = true; v.playsInline = true;
      stage.appendChild(v);
    }else{
      const p = document.createElement('div');
      p.className = 'ph';
      p.innerHTML = `<div>这条素材没有可播放地址</div>`;
      stage.appendChild(p);
    }

    info.innerHTML = `
      <button class="closeBtn" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <h2>${esc(it.title||'未命名素材')}</h2>
      <div class="row"><span class="k">类目</span><span class="v">${esc(it.category||'—')}</span></div>
      <div class="row"><span class="k">达人</span><span class="v">${esc(it.author||'—')}${it.fans? `<span style="color:#5f646d"> · ${fmt(it.fans)}粉</span>`:''}</span></div>
      <div class="row"><span class="k">投放</span><span class="v">${esc(it.launch_date||'—')}${it.days? ` · ${it.days}天`:''}</span></div>
      <div class="row"><span class="k">时长</span><span class="v">${it.duration? dur(it.duration):'—'}</span></div>
      <div class="kpis">
        <div class="kpi"><b>${fmt(it.likes)}</b><span>点赞</span></div>
        <div class="kpi"><b>${fmt(it.comments)}</b><span>评论</span></div>
        <div class="kpi"><b>${fmt(it.collects)}</b><span>收藏</span></div>
      </div>
      <div class="kpis" style="margin-top:0">
        <div class="kpi"><b>${fmt(it.plays)}</b><span>预估播放</span></div>
        <div class="kpi"><b>${it.score!=null? it.score : '—'}</b><span>跑量分</span></div>
        <div class="kpi"><b>${it.ratio? it.ratio : '—'}</b><span>赞播比</span></div>
      </div>
      <div class="acts">
        ${it.source_url ? `<a href="${esc(it.source_url)}" target="_blank" rel="noopener">抖音打开</a>` : ''}
        <a href="${cmSearchUrl(it)}" target="_blank" rel="noopener"
           title="在蝉妈妈素材库里定位这条素材">素材拆解</a>
      </div>
      <div class="foot">数据快照：${esc(DATA.updated||'—')}　·　来源：蝉妈妈 · 创意 AI 素材库</div>
    `;
    info.querySelector('.closeBtn').onclick = closeModal;

    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(){
    modal.classList.remove('open');
    document.body.style.overflow = '';
    stage.querySelectorAll('video').forEach(v=>{ v.pause(); v.remove(); });
    stage.querySelectorAll('iframe').forEach(f=>{ f.src = 'about:blank'; f.remove(); });
    curIdx = -1;
  }
  function step(d){
    if(curIdx < 0) return;
    const n = curIdx + d;
    if(n < 0 || n >= flat.length) return;
    openModal(n);
  }

  modal.onclick = e => { if(e.target === modal) closeModal(); };
  $('#prev').onclick = e => { e.stopPropagation(); step(-1); };
  $('#next').onclick = e => { e.stopPropagation(); step(1); };
  document.addEventListener('keydown', e => {
    if(!modal.classList.contains('open')) return;
    if(e.key === 'Escape') closeModal();
    if(e.key === 'ArrowLeft')  step(-1);
    if(e.key === 'ArrowRight') step(1);
  });

  /* ---------- 搜索 / 排序 ---------- */
  let timer;
  $('#q').oninput = e => {
    clearTimeout(timer);
    const v = e.target.value;
    timer = setTimeout(()=>{ state.q = v; render(); }, 150);
  };
  $('#sort').onchange = e => { state.sort = e.target.value; render(); };

  /* ---------- 启动 ---------- */
  if(DATA.date_label){
    const t = document.getElementById('pageTitle');
    if(t) t.textContent = 'AI素材库（每天更新，' + DATA.date_label + '已更新）';
  }
  render();
  syncSticky();
  window.addEventListener('resize', syncSticky);

  /* ---------- 版本检测：绕过 GitHub Pages 10 分钟 HTML 缓存 ---------- */
  (function checkVersion(){
    const mine = window.__BUILD__ || '';
    if(!mine || mine.indexOf('__BUILD') === 0) return;     // 本地 file:// 直开，跳过
    setTimeout(async () => {
      try{
        const r = await fetch('version.json?_=' + Date.now(), {cache:'no-store'});
        if(!r.ok) return;
        const j = await r.json();
        if(j.v && j.v !== mine) showBar();
      }catch(e){}
    }, 2000);

    function showBar(){
      if(document.getElementById('verBar')) return;
      const b = document.createElement('div');
      b.id = 'verBar';
      b.innerHTML = '<span>素材库有新版本了</span><button>立即刷新</button><i>×</i>';
      b.querySelector('button').onclick = () => {
        location.replace(location.pathname + '?v=' + Date.now());
      };
      b.querySelector('i').onclick = () => b.remove();
      document.body.appendChild(b);
    }
  })();

  // 滚动时高亮导航
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if(!en.isIntersecting) return;
      const cat = en.target.dataset.cat;
      catnav.querySelectorAll('.navItem').forEach(a => {
        a.classList.toggle('on', a.dataset.cat === cat);
      });
    });
  }, {rootMargin:'-120px 0px -70% 0px'});

  setTimeout(()=>{
    main.querySelectorAll('.catBlock').forEach(el => io.observe(el));
  }, 60);
})();
</script>
</body>
</html>
